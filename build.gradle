plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id "org.jetbrains.kotlin.jvm" version "2.3.0"
	id "org.jetbrains.kotlin.plugin.serialization" version "2.3.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://jitpack.io' }
    
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
  }
    
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
    maven { url = "https://api.modrinth.com/maven" }
}

def lwjgl_os_implementations = [
    "org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}:natives-windows",
    "org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}:natives-linux",
    "org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}:natives-macos",
    "org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}:natives-macos-arm64"
]

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Orbit
    implementation "meteordevelopment:orbit:${project.orbit_version}"
    
    // Kotlin serlialization
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:${project.kotlin_serialization_version}")
    
    // To run dev end with mc account
    modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.1")
    
    // Modmenu
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
    
    // NanoVG
    modImplementation("org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}")
    
    lwjgl_os_implementations.each { dep ->
        modImplementation dep
        include dep
    }

    // Iris
    compileOnly("maven.modrinth:iris:${project.iris_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}